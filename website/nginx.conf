server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the single-page app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API to the backend service
    # The backend keys its rate limits on the client address, so it needs the
    # forwarded chain rather than the proxy's own address.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The backend allows a generation three minutes (MODEL_TIMEOUT_MS).
        # nginx defaults to sixty seconds, so a long video or a large prompt
        # was cut here, upstream of the budget that was supposed to govern it.
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;

        # Prompts can now fill a large context window, which is megabytes of
        # body rather than the default one.
        client_max_body_size 16m;
    }

    # Serve uploaded and generated media from the backend
    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;

        # Generated media is named by a uuid and never rewritten, so it can be
        # cached hard rather than revalidated on every view.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy WebSocket streaming to the backend service
    location /ws {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
