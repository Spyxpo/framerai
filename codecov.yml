# The model and the website are tested by separate jobs and upload separately,
# so a commit that touches only one of them arrives at Codecov carrying one
# flag. carryforward keeps the other flag's last known coverage instead of
# reading the absent upload as zero, which would otherwise report a large drop
# on every single-sided change.
flag_management:
  default_rules:
    carryforward: true

coverage:
  status:
    # informational until the suites cover enough of the tree to hold a floor;
    # the check still reports the number, it just does not fail the build.
    project:
      default:
        informational: true
      python:
        flags: [python]
        informational: true
      website:
        flags: [website]
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, flags, components"
  require_changes: true

ignore:
  - "website/src/test/**"
  - "tests/**"
  - "venv/**"
