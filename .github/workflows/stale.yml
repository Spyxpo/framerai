name: Stale

on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,roadmap,good first issue"
          exempt-pr-labels: "pinned,security"
          stale-issue-message: >
            This issue has been inactive for 60 days and is now marked as stale.
            Remove the stale label or comment to keep it open, otherwise it will
            be closed in 14 days.
          stale-pr-message: >
            This pull request has been inactive for 60 days and is now marked as
            stale. Push new commits or comment to keep it open, otherwise it will
            be closed in 14 days.
          close-issue-message: >
            Closing this issue after 14 days of inactivity following the stale
            mark. Reopen it if it is still relevant.
          close-pr-message: >
            Closing this pull request after 14 days of inactivity following the
            stale mark. Reopen it when you are ready to continue.
