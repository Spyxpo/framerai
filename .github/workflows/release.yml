name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0, v1.0.0-beta.1)'
        required: true
        type: string
      publish_images:
        description: 'Publish container images to GHCR'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Dry run: preview release notes without tagging, releasing, or pushing images'
        required: false
        type: boolean
        default: false

  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Draft Release & Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$REF_NAME"
          fi

          if [[ "$TAG" =~ ^[0-9] ]]; then
            TAG="v$TAG"
          fi

          SEMVER_REGEX="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z.-]+))?$"

          if [[ ! "$TAG" =~ $SEMVER_REGEX ]]; then
            echo "::error::Invalid SemVer version string: '$TAG'. Must follow vX.Y.Z or vX.Y.Z-prerelease (e.g. v1.0.0, v1.0.0-beta.1)"
            exit 1
          fi

          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version tag: $TAG"

      - name: Create or Preview Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          FLAGS="--draft"
          if [[ "$TAG" == *"-"* ]]; then
            FLAGS="$FLAGS --prerelease"
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "=== [DRY RUN] Previewing generated release notes for $TAG ==="
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body || echo "Could not preview release notes."
            echo "=== [DRY RUN] Finished preview. No tag, release, or images were published. ==="
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; skipping release creation."
            else
              gh release create "$TAG" --title "Release $TAG" --generate-notes $FLAGS --target "$GITHUB_SHA"
            fi
          fi

  publish-containers:
    name: Container Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: release
    if: ${{ github.event.inputs.dry_run != 'true' && (github.event_name == 'push' || github.event.inputs.publish_images != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: model
            dockerfile: Dockerfile
          - image: backend
            dockerfile: backend/Dockerfile
          - image: website
            dockerfile: website/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        if: matrix.image != 'website'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/framerai-${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.release.outputs.version, '-') }}

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
