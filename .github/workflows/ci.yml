name: CI

on:
  push:
    branches: [stable, beta, dev]
  pull_request:
    branches: [stable, beta, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    name: Model (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lint tooling
        run: python -m pip install --upgrade pip ruff

      - name: Lint (blocking - real errors only)
        run: ruff check --select=E9,F63,F7,F82 model build.py scripts tests conftest.py

      - name: Lint (full - informational)
        continue-on-error: true
        run: ruff check model build.py scripts tests conftest.py

      - name: Byte-compile sources
        run: python -m compileall -q model build.py scripts tests conftest.py

  tests:
    name: Model tests (Python 3.12, CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # CPU-only wheels: the suite never needs a GPU, and the CUDA wheels do not
      # fit on a default runner alongside the preinstalled toolchains.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy Pillow soundfile pytest safetensors

      - name: Run tests
        run: python -m pytest -q

      # Every preset, up to the trillion-parameter flagship, must be sizable on a
      # 2-core runner: the estimator allocates nothing.
      - name: Estimate presets without instantiating them
        run: |
          python build.py --list-presets
          python build.py --preset framer-1t-a32b --estimate
          python build.py --preset framer-200b-a20b --estimate

  backend:
    name: Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax check
        working-directory: backend
        run: |
          status=0
          while IFS= read -r file; do
            node --check "$file" || status=1
          done < <(find src -name '*.js')
          exit $status

      - name: Test
        working-directory: backend
        run: npm test

  website:
    name: Website (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

  docker:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: model
            dockerfile: Dockerfile
          - image: backend
            dockerfile: backend/Dockerfile
          - image: website
            dockerfile: website/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The model and backend images install torch, which does not fit
      # alongside the preinstalled toolchains on a default runner.
      - name: Free disk space
        if: matrix.image != 'website'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: framerai-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose:
    name: Compose file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
