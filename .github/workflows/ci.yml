name: CI

on:
  push:
    branches: [stable, beta, dev]
  pull_request:
    branches: [stable, beta, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A co-author trailer naming an AI vendor attaches that name to the commit
      # and to every pull request that carries it, and a pull request ref is
      # frozen once the pull request merges - GitHub Support is then the only
      # way to remove it. Far cheaper to fail here, while the branch can still
      # be rewritten.
      - name: Reject AI co-author trailers
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            range="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          if git log --format='%H%n%B' "$range" | grep -inE 'co-authored-by:.*(anthropic|claude)'; then
            echo "::error::a commit message in $range carries an AI co-author trailer; strip it and force-push"
            exit 1
          fi
          echo "clean: $range"

  model:
    name: Model (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lint tooling
        run: python -m pip install --upgrade pip ruff

      # The full ruff.toml rule set is blocking. It was informational while the
      # tree was brought up to it; the tree passes clean now, so a regression
      # should fail the build rather than scroll past in a green log.
      - name: Lint
        run: ruff check model build.py scripts tests conftest.py

      - name: Byte-compile sources
        run: python -m compileall -q model build.py scripts tests conftest.py

  tests:
    name: Model tests (Python 3.12, CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # torch comes from the CPU wheel index first: the suite never needs a GPU
      # and the CUDA wheels do not fit on a default runner alongside the
      # preinstalled toolchains. Everything else installs from the requirements
      # files, so the tested dependency set is the shipped dependency set. It
      # previously did not match, and a runtime dependency could be added
      # without CI noticing.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q --cov=model --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python
          path: coverage.xml
          if-no-files-found: warn

      # The artifact holds the raw report; Codecov is what the README badge and
      # the pull request comment read from. Both halves of the repo report to
      # the same Codecov project and are told apart by their flag.
      #
      # A pull request opened from a fork gets no secrets, so it cannot upload
      # from here at all. Its artifact is picked up afterwards by
      # coverage-upload.yml, which runs in this repository's context and does
      # have the token. Skipping the step outright beats letting it run without
      # one: Codecov's tokenless path is best-effort and would report a fork's
      # coverage only sometimes, which is worse than never.
      - name: Upload coverage to Codecov
        if: github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          disable_search: true
          fail_ci_if_error: true

      # Every preset, up to the two-trillion-parameter flagship, must be sizable
      # on a 2-core runner: the estimator allocates nothing.
      - name: Estimate presets without instantiating them
        run: |
          python build.py --list-presets
          python build.py --preset framer-2t-a49b --estimate
          python build.py --preset framer-1t-a32b --estimate
          python build.py --preset framer-200b-a20b --estimate

  backend:
    name: Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax check
        working-directory: backend
        run: |
          status=0
          while IFS= read -r file; do
            node --check "$file" || status=1
          done < <(find src -name '*.js')
          exit $status

      - name: Test
        working-directory: backend
        run: npm test

      - name: Check OpenAPI schema consistency
        working-directory: backend
        run: npm run openapi:check

  website:
    name: Website (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vite 8 requires Node ^20.19 || >=22.12, so the website cannot build on
        # Node 18. The backend still supports it and keeps 18 in its matrix.
        node-version: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Lint
        working-directory: website
        run: npm run lint

      - name: Test with coverage
        working-directory: website
        run: npm run test:coverage

      # Every leg of the matrix runs this step, so the name has to carry the Node
      # version. Two uploads under one name land as two artifacts sharing it,
      # and nothing downstream can then say which run produced which report.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-website-node${{ matrix.node-version }}
          path: website/coverage/
          if-no-files-found: warn

      # Codecov merges same-flag uploads for a commit, so sending every leg of
      # the matrix would only re-send identical line hits under a slower build.
      # One version reports; the rest still produce artifacts above. Forks have
      # no token here and are handled by coverage-upload.yml instead.
      - name: Upload coverage to Codecov
        if: matrix.node-version == '22' && github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: website/coverage/lcov.info
          flags: website
          disable_search: true
          fail_ci_if_error: true

      - name: Build
        working-directory: website
        run: npm run build

  docker:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: model
            dockerfile: Dockerfile
          - image: backend
            dockerfile: backend/Dockerfile
          - image: website
            dockerfile: website/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The model and backend images install torch, which does not fit
      # alongside the preinstalled toolchains on a default runner.
      - name: Free disk space
        if: matrix.image != 'website'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: framerai-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose:
    name: Compose file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
